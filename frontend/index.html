<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Voxis AI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #0b1020;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app {
      width: 100%;
      max-width: 900px;
      height: 95vh;
      background: #111827;
      border-radius: 20px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
    }

    /* HEADER */

    .header {
      padding: 18px 20px;
      background: #151d31;
      border-bottom: 1px solid #263149;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 45px;
      height: 45px;
      border-radius: 14px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 23px;
      font-weight: bold;
    }

    .brand h1 {
      font-size: 21px;
    }

    .brand p {
      font-size: 12px;
      color: #9ca3af;
      margin-top: 3px;
    }

    .status {
      font-size: 12px;
      color: #4ade80;
    }

    /* CHAT */

    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 25px 18px;
    }

    .welcome {
      text-align: center;
      margin-top: 60px;
      color: #cbd5e1;
    }

    .welcome-icon {
      font-size: 55px;
      margin-bottom: 15px;
    }

    .welcome h2 {
      font-size: 27px;
      margin-bottom: 8px;
    }

    .welcome p {
      color: #94a3b8;
      font-size: 14px;
    }

    .message {
      max-width: 80%;
      padding: 13px 16px;
      margin: 12px 0;
      border-radius: 16px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .user {
      margin-left: auto;
      background: #4f46e5;
      border-bottom-right-radius: 4px;
    }

    .bot {
      margin-right: auto;
      background: #1f2937;
      border: 1px solid #303b52;
      border-bottom-left-radius: 4px;
    }

    .typing {
      color: #9ca3af;
      font-size: 13px;
      margin: 10px;
    }

    /* INPUT */

    .input-area {
      padding: 15px;
      background: #151d31;
      border-top: 1px solid #263149;
    }

    .input-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 7px;
    }

    textarea {
      flex: 1;
      resize: none;
      border: none;
      outline: none;
      background: transparent;
      color: white;
      padding: 10px;
      font-size: 15px;
      min-height: 42px;
      max-height: 120px;
    }

    textarea::placeholder {
      color: #64748b;
    }

    button {
      border: none;
      cursor: pointer;
    }

    .icon-btn {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: #1e293b;
      color: white;
      font-size: 18px;
    }

    .icon-btn:hover {
      background: #334155;
    }

    .send-btn {
      width: 45px;
      height: 45px;
      border-radius: 13px;
      background: #6366f1;
      color: white;
      font-size: 19px;
    }

    .send-btn:hover {
      background: #4f46e5;
    }

    .voice-active {
      background: #dc2626 !important;
    }

    .footer {
      text-align: center;
      color: #64748b;
      font-size: 11px;
      margin-top: 8px;
    }

    /* MOBILE */

    @media (max-width: 600px) {
      body {
        align-items: stretch;
      }

      .app {
        height: 100vh;
        border-radius: 0;
      }

      .message {
        max-width: 88%;
      }

      .welcome {
        margin-top: 80px;
      }

      .welcome h2 {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <!-- HEADER -->

    <header class="header">

      <div class="brand">

        <div class="logo">
          V
        </div>

        <div>
          <h1>Voxis AI</h1>
          <p>Your intelligent AI assistant</p>
        </div>

      </div>

      <div class="status">
        ● Online
      </div>

    </header>


    <!-- CHAT AREA -->

    <main class="chat" id="chat">

      <div class="welcome" id="welcome">

        <div class="welcome-icon">
          🤖
        </div>

        <h2>How can I help you?</h2>

        <p>
          Ask anything or use the microphone to talk with Voxis.
        </p>

      </div>

    </main>


    <!-- INPUT -->

    <section class="input-area">

      <div class="input-box">

        <button
          class="icon-btn"
          id="micBtn"
          onclick="startVoice()"
          title="Voice input"
        >
          🎤
        </button>

        <textarea
          id="messageInput"
          placeholder="Ask Voxis anything..."
          rows="1"
        ></textarea>

        <button
          class="send-btn"
          onclick="sendMessage()"
          title="Send"
        >
          ➤
        </button>

      </div>

      <div class="footer">
        Voxis AI • Powered by AI
      </div>

    </section>

  </div>


  <script>

    /*
      IMPORTANT:
      Replace this with your Render backend URL
      after backend deployment.

      Example:
      https://voxis-ai-backend.onrender.com
    */

    const API_URL = "https://voxis-ai-il2n.onrender.com";


    const chat = document.getElementById("chat");
    const input = document.getElementById("messageInput");
    const welcome = document.getElementById("welcome");
    const micBtn = document.getElementById("micBtn");


    // ENTER TO SEND

    input.addEventListener("keydown", function(event) {

      if (event.key === "Enter" && !event.shiftKey) {

        event.preventDefault();

        sendMessage();

      }

    });


    // AUTO RESIZE TEXTAREA

    input.addEventListener("input", function() {

      this.style.height = "auto";

      this.style.height =
        Math.min(this.scrollHeight, 120) + "px";

    });


    // ADD MESSAGE

    function addMessage(text, type) {

      if (welcome) {
        welcome.style.display = "none";
      }

      const message = document.createElement("div");

      message.className = "message " + type;

      message.textContent = text;

      chat.appendChild(message);

      chat.scrollTop = chat.scrollHeight;

    }


    // TYPING INDICATOR

    function showTyping() {

      const typing = document.createElement("div");

      typing.id = "typing";

      typing.className = "typing";

      typing.textContent = "Voxis is thinking...";

      chat.appendChild(typing);

      chat.scrollTop = chat.scrollHeight;

    }


    function removeTyping() {

      const typing =
        document.getElementById("typing");

      if (typing) {
        typing.remove();
      }

    }


    // SEND MESSAGE

    async function sendMessage() {

      const message = input.value.trim();

      if (!message) {
        return;
      }


      addMessage(message, "user");

      input.value = "";

      input.style.height = "auto";

      showTyping();


      try {

        const response = await fetch(
          API_URL + "/chat",
          {
            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({
              message: message
            })
          }
        );


        const data = await response.json();

        removeTyping();


        if (data.reply) {

          addMessage(data.reply, "bot");

          speak(data.reply);

        } else {

          addMessage(
            "Voxis did not return a response.",
            "bot"
          );

        }

      } catch (error) {

        removeTyping();

        addMessage(
          "Unable to connect to Voxis backend. Please check the backend URL.",
          "bot"
        );

        console.error(error);

      }

    }


    // VOICE INPUT

    function startVoice() {

      const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


      if (!SpeechRecognition) {

        alert(
          "Voice recognition is not supported in this browser."
        );

        return;

      }


      const recognition =
        new SpeechRecognition();


      recognition.lang = "en-IN";

      recognition.interimResults = false;

      recognition.continuous = false;


      micBtn.classList.add("voice-active");

      micBtn.textContent = "🔴";


      recognition.start();


      recognition.onresult = function(event) {

        const transcript =
          event.results[0][0].transcript;

        input.value = transcript;

        sendMessage();

      };


      recognition.onerror = function() {

        console.log("Voice recognition error");

      };


      recognition.onend = function() {

        micBtn.classList.remove("voice-active");

        micBtn.textContent = "🎤";

      };

    }


    // TEXT TO SPEECH

    function speak(text) {

      if (!("speechSynthesis" in window)) {
        return;
      }


      window.speechSynthesis.cancel();


      const speech =
        new SpeechSynthesisUtterance(text);


      speech.lang = "en-IN";

      speech.rate = 1;

      speech.pitch = 1;


      window.speechSynthesis.speak(speech);

    }

  </script>

</body>
</html>
